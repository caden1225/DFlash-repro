# ============================================================================
# DFlash Configuration for Qwen3-8B
# ============================================================================
# This config trains a DFlash draft model for Qwen/Qwen3-8B.
# Hardware requirement: 4x H100 GPUs (2 for vLLM, 2 for training)
#
# Usage:
#   python train.py --config configs/qwen3_8b.yaml
#
#   # With torchrun (distributed):
#   torchrun --standalone --nproc_per_node=4 train.py --config configs/qwen3_8b.yaml
# ============================================================================

model:
  target_model: "Qwen/Qwen3-8B"
  target_model_type: "qwen3"
  draft_num_layers: 5
  draft_vocab_size: 8192
  block_size: 16
  target_layer_ids: null        # Auto-compute: [1, 6, 11, 17, 22] for 28-layer Qwen3
  max_seq_len: 3072
  dtype: "bfloat16"

data:
  dataset_name: "lmsys/sharegpt_jsonl"
  dataset_type: "huggingface"
  text_field: "conversations"
  regenerate_responses: true
  regen_temperature: 0.6
  regen_max_tokens: 2048
  train_split: "train"
  max_samples: null

training:
  epochs: 6
  batch_size: 4
  learning_rate: 0.0006
  weight_decay: 0.01
  gradient_clipping: 1.0
  warmup_ratio: 0.04
  scheduler: "cosine"
  num_anchors: 512
  loss_decay_gamma: 7.0         # block_size=16 -> gamma=7
  max_anchors_training: 3072
  online_training: true
  optimizer: "adamw"
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  seed: 42

hidden_states:
  extraction_mode: "online"     # online / offline / hybrid
  vllm_endpoint: "http://localhost:8000/v1"
  vllm_port: 8000
  tensor_parallel_size: 1
  data_parallel_size: 2
  gpu_memory_utilization: 0.9
  cache_dir: "./cache/hidden_states_qwen3_8b"
  num_proc: 8

inference:
  temperature: 0.0
  max_new_tokens: 2048
  num_speculative_tokens: 15
  device: "cuda"

evaluation:
  datasets:
    - "gsm8k"
    - "math500"
    - "humaneval"
  num_samples: 128
  concurrency: 1
  output_dir: "./eval_results"

output:
  checkpoint_dir: "./checkpoints/dflash_qwen3_8b"
  save_every: 1
  logging_dir: "./logs"
  log_every: 10

distributed:
  backend: "nccl"
  world_size: null
  rank: null
  local_rank: null
  use_fsdp: true

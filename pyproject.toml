[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dflash-reproduce"
version = "0.1.0"
description = "Complete reproduction framework for DFlash block diffusion speculative decoding"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "DFlash Reproduce Team"}
]
keywords = ["llm", "speculative-decoding", "block-diffusion", "dflash", "inference-acceleration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "rich",
    "loguru",
    "numpy",
    "tqdm",
    "datasets>=3,<4",
    "requests",
    "huggingface-hub<1",
    "pyyaml>=6.0",
    "typing-extensions",
]

[project.optional-dependencies]
transformers = [
    "torch>=2.0.0",
    "transformers==4.57.1",
    "accelerate>=1.1.0",
]
vllm = [
    "vllm",
    "datasets>=3,<4",
    "huggingface-hub<1",
]
flash = [
    "flash-attn>=2.4.0",
]
mlx = [
    "mlx==0.31.2",
    "mlx-lm==0.31.3",
]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]
all = [
    "torch>=2.0.0",
    "transformers==4.57.1",
    "accelerate>=1.1.0",
    "vllm",
    "datasets>=3,<4",
    "huggingface-hub<1",
    "flash-attn>=2.4.0",
    "pytest>=7.4.0",
]

[project.scripts]
dflash-train = "train:main"
dflash-inference = "inference_cli:main"
dflash-evaluate = "evaluate:main"

[project.urls]
Homepage = "https://github.com/z-lab/dflash"
Repository = "https://github.com/z-lab/dflash"

[tool.setuptools.packages.find]
include = ["dflash_reproduce*"]

[tool.setuptools.package-data]
dflash_reproduce = ["*.yaml", "*.json"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
